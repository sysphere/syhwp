[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syhwp"
version = "0.0.8"
description = "Read Korean HWP and HWPX (Hancom Office / 한글) documents in pure Python — text, tables, Markdown, HTML."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "sysphere" }]
keywords = [
    "hwp",
    "hwpx",
    "hwp5",
    "owpml",
    "hancom",
    "hancom-office",
    "한글",
    "korean",
    "parser",
    "reader",
    "text-extraction",
    "hwp-to-text",
    "hwp-to-markdown",
    "markdown",
    "document",
    "rag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Korean",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Markup",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["olefile>=0.46"]

[project.optional-dependencies]
# Distribution (copy-protected) documents decrypt ~90x faster with a native AES;
# without it the bundled pure-Python one is used, so this stays optional.
fast = ["cryptography>=42"]
test = ["pytest>=7", "cryptography>=42"]

[project.scripts]
syhwp = "syhwp.__main__:main"

[project.urls]
Homepage = "https://github.com/sysphere/syhwp"
Source = "https://github.com/sysphere/syhwp"
Issues = "https://github.com/sysphere/syhwp/issues"
Changelog = "https://github.com/sysphere/syhwp/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/syhwp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
